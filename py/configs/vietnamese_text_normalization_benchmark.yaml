benchmark:
  name: vietnamese_text_normalization
  language: vi
  description: Compare symbolic Vietnamese inputs against pre-normalized Vietnamese text for TTS quality/performance experiments.

runtime:
  onnx_dir: ../assets/onnx
  voice_style: ../assets/voice_styles/F1.json
  total_step: 6
  speed: 1.5
  intra_op_num_threads: 2
  inter_op_num_threads: 1
  warmup_runs: 1
  repeats_per_case: 1
  save_audio: true
  output_dir: results/vietnamese_tn_benchmark

metrics:
  include:
    - latency_seconds
    - audio_duration_seconds
    - rtf
    - throughput_chars_per_second
    - throughput_audio_seconds_per_second
    - peak_rss_mb

normalization_methods:
  - id: symbolic_passthrough
    input_field: symbolic
    description: Feed the symbolic text directly to Supertonic preprocessing.
  - id: human_normalized
    input_field: normalized
    description: Feed manually normalized Vietnamese text.

